<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Registrer</title>
  <script type="module">
    import { handleRegistration, loginWithGoogle } from "./app.js";

    document.addEventListener("DOMContentLoaded", () => {
      const email = document.getElementById("email");
      const pass = document.getElementById("password");
      const regBtn = document.getElementById("registerBtn");
      const googleBtn = document.getElementById("googleBtn");
      const status = document.getElementById("status");

      regBtn.addEventListener("click", () =>
        handleRegistration(email.value, pass.value, status)
      );

      googleBtn.addEventListener("click", () =>
        loginWithGoogle(status)
      );
    });
  </script>
</head>
<body>
  <h1>Registrer deg</h1>
  <input type="email" id="email" placeholder="E-post" />
  <input type="password" id="password" placeholder="Passord" />
  <button id="registerBtn">Registrer</button>
  <button id="googleBtn">Google-login</button>
  <p id="status"></p>
</body>
</html>
