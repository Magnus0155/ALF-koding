<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Logg inn</title>

  <!--legg i js fil istedenfor-->
  <script type="module">
    import { handleLogin } from "./app.js";

    document.addEventListener("DOMContentLoaded", () => {
      const email = document.getElementById("loginEmail");
      const pass = document.getElementById("loginPassword");
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("loginStatus");

      btn.addEventListener("click", () => {
        handleLogin(email.value, pass.value, status);
      });
    });
  </script>
</head>
<body>
    <header class="flex-between header">
    <div class="logo-container">
      <a href="index.html">
        <img id="headerLogo" src="images/air.png" alt="Logo" />
      </a>
    </div>
    <nav>
      <ul class="nav-list flex-between">
        <li><a href="index.html">Hjem</a></li>
        <li><a href="OmOss.html">Om oss</a></li>
        <li><a href="filtrering.html">Reisemål</a></li>
        <li><a href="Lag en konto.html">Logg inn</a></li>
        <li><a href="Kontakt oss.html">Kontakt us</a></li>
        <li><a href="Bestilllingsside.html">Bestill en reise</a></li>
        <li><a href="mine-bestillinger.html">Mine bestillinger</a></li>
      </ul>
    </nav>
  </header>  

  <h1>Logg inn</h1>
  <input type="email" id="loginEmail" placeholder="E-post" />
  <input type="password" id="loginPassword" placeholder="Passord" />
  <button id="loginBtn">Logg inn</button>
  <p id="loginStatus"></p>
  <p><a href="index.html">Tilbake til forsiden</a></p>
</body>
</html>
