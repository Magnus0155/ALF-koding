<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Logg inn</title>

  <!--legg i js fil istedenfor-->
  <script type="module">
    import { handleLogin } from "./app.js";

    document.addEventListener("DOMContentLoaded", () => {
      const email = document.getElementById("loginEmail");
      const pass = document.getElementById("loginPassword");
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("loginStatus");

      btn.addEventListener("click", () => {
        handleLogin(email.value, pass.value, status);
      });
    });
  </script>
</head>
<body>
  <h1>Logg inn</h1>
  <input type="email" id="loginEmail" placeholder="E-post" />
  <input type="password" id="loginPassword" placeholder="Passord" />
  <button id="loginBtn">Logg inn</button>
  <p id="loginStatus"></p>
  <p><a href="index.html">Tilbake til forsiden</a></p>
</body>
</html>
